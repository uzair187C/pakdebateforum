<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PDF 意见与反馈中心 — 欢迎提交课程、赛事、教练辅导及网站体验的宝贵意见。" />
  <meta name="keywords" content="feedback, debate feedback, pak debate forum feedback, 意见反馈, 课程评价, 赛事反馈" />
  <meta name="theme-color" content="#C9A24A" />
  <meta name="robots" content="index, follow" />

  <link rel="canonical" href="https://pakdebateforum.org/feedback.html" />
  <link rel="alternate" hreflang="en" href="https://pakdebateforum.org/feedback.html" />
  <link rel="alternate" hreflang="zh-CN" href="https://pakdebateforum.org/feedback.html?lang=zh" />

  <!-- Open Graph / WeChat / Social -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Pak Debate Forum 巴基斯坦辩论论坛" />
  <meta property="og:title" content="PDF 意见与反馈中心 (Feedback)" />
  <meta property="og:description" content="您的声音帮助我们不断完善辩论学院与赛事体验。" />
  <meta property="og:url" content="https://pakdebateforum.org/feedback.html" />
  <meta property="og:image" content="https://pakdebateforum.org/assets/brand/pdf-logo.png" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="zh_CN" />

  <meta name="wechat:title" content="PDF 辩论论坛与学院意见反馈" />
  <meta name="wechat:description" content="欢迎随时向我们提出您的建议。" />
  <meta name="wechat:image" content="https://pakdebateforum.org/assets/brand/pdf-logo.png" />

  <title>PDF 意见与反馈中心 — 反馈表单 (Feedback &amp; Suggestions)</title>
  <script>
    (function(){
      var t = localStorage.getItem('pdf_theme') || 'dark';
      var l = localStorage.getItem('pdf_lang');
      if (!l) {
        try {
          var langs = navigator.languages || [navigator.language || ''];
          var hasZh = langs.some(function(lang){ return String(lang || '').toLowerCase().startsWith('zh'); });
          var tz = typeof Intl !== 'undefined' && Intl.DateTimeFormat ? Intl.DateTimeFormat().resolvedOptions().timeZone || '' : '';
          var chinaTz = ['Asia/Shanghai', 'Asia/Chongqing', 'Asia/Urumqi', 'Asia/Harbin', 'Asia/Hong_Kong', 'Asia/Macau', 'Asia/Taipei'];
          if (hasZh || chinaTz.indexOf(tz) !== -1) { l = 'zh'; }
        } catch(e){}
      }
      l = l === 'zh' ? 'zh' : 'en';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('lang', l === 'zh' ? 'zh-CN' : 'en');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/page.css" />
  <link rel="stylesheet" href="/css/animations.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header id="app-nav"></header>
  <div id="app-drawer"></div>

  <main id="main-content">

    <section class="page-hero">
      <div class="container" style="max-width: 640px;">
        <div class="section-header" data-reveal>
          <p class="eyebrow" data-i18n="feedback.eyebrow">We're Listening</p>
          <h1 class="section-title" data-i18n="feedback.title">Share Your Feedback</h1>
          <p class="section-subtitle" data-i18n="feedback.subtitle">Your feedback helps us improve our programmes, events, and coaching. All submissions are read by the team.</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container" style="max-width: 640px;">

        <div id="alert-area"></div>

        <div id="success-view" style="display: none;">
          <div class="alert alert--success" style="padding: var(--sp-8); text-align: center;">
            <div style="font-size: var(--text-heading-lg); margin-bottom: var(--sp-3);">✓</div>
            <h2 style="font-family: var(--font-display); font-size: var(--text-heading-lg); margin-bottom: var(--sp-3); color: var(--color-text-primary);" data-i18n="feedback.success_title">Thank You!</h2>
            <p style="color: var(--color-text-supporting);" data-i18n="feedback.success_msg">Your feedback has been received. We appreciate you taking the time.</p>
            <div style="margin-top: var(--sp-6);"><a href="/" class="btn btn--ghost btn--sm" data-i18n="btn.back_home">Back to Home</a></div>
          </div>
        </div>

        <form id="feedback-form" novalidate data-reveal>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="name" data-i18n="contact.name_label">Your Name <span class="req">*</span></label>
              <input class="form-input" id="name" type="text" placeholder="Full name" data-i18n-placeholder="contact.name_placeholder" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="email" data-i18n="contact.email_label">Email Address <span class="req">*</span></label>
              <input class="form-input" id="email" type="email" placeholder="you@example.com" data-i18n-placeholder="contact.email_placeholder" required />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="category" data-i18n="contact.category_label">Feedback Category <span class="req">*</span></label>
            <select class="form-select" id="category" required>
              <option value="" data-i18n="feedback.select_cat">— Select a category —</option>
              <option value="general" data-i18n="contact.subj_general">General</option>
              <option value="program" data-i18n="contact.subj_program">Programme Feedback</option>
              <option value="event" data-i18n="contact.subj_event">Event Feedback</option>
              <option value="coach" data-i18n="contact.subj_coach">Coach Feedback</option>
              <option value="website" data-i18n="contact.subj_website">Website Feedback</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="message" data-i18n="contact.message_label">Your Message <span class="req">*</span></label>
            <textarea class="form-textarea" id="message" placeholder="Share your thoughts, suggestions, or concerns…" data-i18n-placeholder="contact.message_placeholder" style="min-height: 160px;" required></textarea>
          </div>
          <button type="submit" class="btn btn--primary btn--lg btn--full" id="submit-btn" data-i18n="btn.submit_feedback">Submit Feedback →</button>
        </form>

      </div>
    </section>

  </main>

  <footer id="app-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.getElementById('feedback-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const name     = document.getElementById('name').value.trim();
      const email    = document.getElementById('email').value.trim();
      const category = document.getElementById('category').value;
      const message  = document.getElementById('message').value.trim();

      if (!name || !email || !category || !message) {
        document.getElementById('alert-area').innerHTML = '<div class="alert alert--error">Please fill in all required fields.</div>';
        if (window.showToast) window.showToast('Please fill in required fields.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Submitting…';
      document.getElementById('alert-area').innerHTML = '';

      try {
        await API.feedback.create({ name, email, category, message });
        document.getElementById('feedback-form').style.display = 'none';
        document.getElementById('success-view').style.display  = 'block';
        if (window.showToast) window.showToast('Feedback submitted successfully!', 'success');
      } catch(err) {
        document.getElementById('alert-area').innerHTML = `<div class="alert alert--error">${err.message}</div>`;
        if (window.showToast) window.showToast(err.message || 'Feedback submission failed.', 'error');
        btn.disabled = false;
        btn.textContent = 'Submit Feedback →';
      }
    });
  </script>
</body>
</html>
