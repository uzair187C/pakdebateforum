<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Share your feedback with Pak Debate Forum — programme, event, coaching, and website feedback welcome." />
  <meta name="theme-color" content="#050505" />
  <title>Feedback — Pak Debate Forum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/page.css" />
  <link rel="stylesheet" href="/css/animations.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header id="app-nav"></header>
  <div id="app-drawer"></div>

  <main id="main-content">

    <section class="page-hero">
      <div class="container" style="max-width: 640px;">
        <div class="section-header" data-reveal>
          <p class="eyebrow">We're Listening</p>
          <h1 class="section-title">Share Your Feedback</h1>
          <p class="section-subtitle">Your feedback helps us improve our programmes, events, and coaching. All submissions are read by the team.</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container" style="max-width: 640px;">

        <div id="alert-area"></div>

        <div id="success-view" style="display: none;">
          <div class="alert alert--success" style="padding: var(--sp-8); text-align: center;">
            <div style="font-size: var(--text-heading-lg); margin-bottom: var(--sp-3);">✓</div>
            <h2 style="font-family: var(--font-display); font-size: var(--text-heading-lg); margin-bottom: var(--sp-3); color: var(--color-text-primary);">Thank You!</h2>
            <p style="color: var(--color-text-supporting);">Your feedback has been received. We appreciate you taking the time.</p>
            <div style="margin-top: var(--sp-6);"><a href="/" class="btn btn--ghost btn--sm">Back to Home</a></div>
          </div>
        </div>

        <form id="feedback-form" novalidate data-reveal>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="name">Your Name <span class="req">*</span></label>
              <input class="form-input" id="name" type="text" placeholder="Full name" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="email">Email Address <span class="req">*</span></label>
              <input class="form-input" id="email" type="email" placeholder="you@example.com" required />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="category">Feedback Category <span class="req">*</span></label>
            <select class="form-select" id="category" required>
              <option value="">— Select a category —</option>
              <option value="general">General</option>
              <option value="program">Programme Feedback</option>
              <option value="event">Event Feedback</option>
              <option value="coach">Coach Feedback</option>
              <option value="website">Website Feedback</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="message">Your Message <span class="req">*</span></label>
            <textarea class="form-textarea" id="message" placeholder="Share your thoughts, suggestions, or concerns…" style="min-height: 160px;" required></textarea>
          </div>
          <button type="submit" class="btn btn--primary btn--lg btn--full" id="submit-btn">Submit Feedback →</button>
        </form>

      </div>
    </section>

  </main>

  <footer id="app-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.getElementById('feedback-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const name     = document.getElementById('name').value.trim();
      const email    = document.getElementById('email').value.trim();
      const category = document.getElementById('category').value;
      const message  = document.getElementById('message').value.trim();

      if (!name || !email || !category || !message) {
        document.getElementById('alert-area').innerHTML = '<div class="alert alert--error">Please fill in all required fields.</div>';
        if (window.showToast) window.showToast('Please fill in required fields.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Submitting…';
      document.getElementById('alert-area').innerHTML = '';

      try {
        await API.feedback.create({ name, email, category, message });
        document.getElementById('feedback-form').style.display = 'none';
        document.getElementById('success-view').style.display  = 'block';
        if (window.showToast) window.showToast('Feedback submitted successfully!', 'success');
      } catch(err) {
        document.getElementById('alert-area').innerHTML = `<div class="alert alert--error">${err.message}</div>`;
        if (window.showToast) window.showToast(err.message || 'Feedback submission failed.', 'error');
        btn.disabled = false;
        btn.textContent = 'Submit Feedback →';
      }
    });
  </script>
</body>
</html>
