      var t = localStorage.getItem('pdf_theme') || 'dark';

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />

</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header id="app-nav"></header>
  <div id="app-drawer"></div>

  <main id="main-content">

    <section class="page-hero">
      <div class="container">
        <div class="section-header" data-reveal>
          <p class="eyebrow" data-i18n="about.team_eyebrow">Our Team</p>
          <h1 class="section-title" style="font-size: var(--text-display-lg);" data-i18n="coaches.hero_title">Meet the Coaches</h1>
          <p class="section-subtitle" data-i18n="coaches.hero_subtitle">Our coaches bring national and international competitive experience. Every programme is designed and delivered by practitioners, not theorists.</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div id="coaches-grid" class="grid-3">
          <div class="state-loading"><div class="spinner"></div></div>
        </div>
      </div>
    </section>

  </main>

  <footer id="app-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/main.js"></script>
  <script>
    async function init() {
      try {
        const { coaches } = await API.coaches.list();
        const el = document.getElementById('coaches-grid');
        if (!coaches.length) { 
          el.innerHTML = '<div class="state-empty" data-i18n="coaches.empty">No coaches listed yet.</div>'; 
          if (window.I18N) window.I18N.translateDOM(el);
          return; 
        }
        el.innerHTML = coaches.map(c => {
          let tags = [];
          try { tags = JSON.parse(c.expertise || '[]'); } catch {}
          const initials = c.name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
          const title = window.I18N ? window.I18N.db(c.slug, 'title', c.title) : c.title;
          const bio = window.I18N ? window.I18N.db(c.slug, 'bio', c.bio) : c.bio;
          return `
            <div class="card card--person" data-reveal>
              <div class="card__avatar" style="width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: var(--text-heading-lg); color: var(--color-accent-gold); background: var(--color-bg-section); border: 2px solid rgba(201, 162, 74, 0.2);">${initials}</div>
              <h2 class="card__name">${c.name}</h2>
              <p class="card__role">${title}</p>
              ${bio ? `<p class="card__bio">${bio}</p>` : ''}
              ${tags.length ? `<div style="display: flex; gap: var(--sp-2); flex-wrap: wrap; justify-content: center; margin-top: var(--sp-4);">${tags.map(t => `<span class="badge badge--accent">${t}</span>`).join('')}</div>` : ''}
            </div>`;
        }).join('');
        if (window.initReveals) window.initReveals(el);
        if (window.I18N) window.I18N.translateDOM(el);
      } catch(e) {
        document.getElementById('coaches-grid').innerHTML = `<div class="state-error">${e.message}</div>`;
      }
    }
    init();
  </script>
</body>
</html>
