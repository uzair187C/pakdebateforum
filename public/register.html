<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Register for Pak Debate Forum programmes and tournaments — Online application and registration portal." />
  <meta name="keywords" content="debate registration, debate program application, WSDC tournament sign up, pak debate registration" />
  <meta name="theme-color" content="#C9A24A" />
  <meta name="robots" content="index, follow" />

  <link rel="canonical" href="https://pakdebateforum.org/register.html" />
  <link rel="alternate" hreflang="en" href="https://pakdebateforum.org/register.html" />
  <link rel="alternate" hreflang="zh-CN" href="https://pakdebateforum.org/register.html?lang=zh" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Pak Debate Forum" />
  <meta property="og:title" content="Online Registration — Pak Debate Forum" />
  <meta property="og:description" content="Apply for training programmes, debate workshops, and tournament registrations." />
  <meta property="og:url" content="https://pakdebateforum.org/register.html" />
  <meta property="og:image" content="https://pakdebateforum.org/assets/brand/pdf-logo.png" />

  <title>Online Registration — Pak Debate Forum</title>
  <script>
    (function(){
      var t = localStorage.getItem('pdf_theme') || 'dark';
      var l = localStorage.getItem('pdf_lang') || 'en';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('lang', l === 'zh' ? 'zh-CN' : 'en');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/page.css" />
  <link rel="stylesheet" href="/css/animations.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header id="app-nav"></header>
  <div id="app-drawer"></div>

  <main id="main-content">

    <section class="page-hero">
      <div class="container" style="max-width: 720px;">
        <a href="javascript:history.back()" style="font-size: var(--text-body-sm); color: var(--color-text-muted); display: inline-flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-6); text-decoration: none;" data-i18n="nav.back">← Back</a>
        <div class="section-header" data-reveal>
          <p class="eyebrow" id="reg-type-label" data-i18n="register.eyebrow">Registration</p>
          <h1 class="section-title" id="reg-title" data-i18n="register.title">Apply</h1>
          <p class="section-subtitle" id="reg-subtitle" data-i18n="register.subtitle">Complete the form below to submit your registration.</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container" style="max-width: 720px;">

        <div id="alert-area"></div>

        <div id="success-view" style="display: none;">
          <div class="alert alert--success" style="padding: var(--sp-8); text-align: center;">
            <div style="font-size: var(--text-heading-lg); margin-bottom: var(--sp-3);">✓</div>
            <h2 style="font-family: var(--font-display); font-size: var(--text-heading-lg); margin-bottom: var(--sp-3); color: var(--color-text-primary);" data-i18n="register.success_title">Registration Submitted!</h2>
            <p id="success-msg" style="color: var(--color-text-supporting);" data-i18n="register.success_msg">Your registration has been received. We will be in touch shortly.</p>
            <div style="display: flex; gap: var(--sp-3); justify-content: center; flex-wrap: wrap; margin-top: var(--sp-6);">
              <a href="/events.html" class="btn btn--ghost btn--sm" data-i18n="btn.view_all_events">View Events</a>
              <a href="/programs.html" class="btn btn--ghost btn--sm" data-i18n="btn.view_programs">View Programs</a>
            </div>
          </div>
        </div>

        <form id="reg-form" novalidate data-reveal>
          <div class="form-group" id="target-group" style="display: none; margin-bottom: var(--sp-5);">
            <label class="form-label" for="target_select">Select Programme or Event <span class="req">*</span></label>
            <select class="form-select" id="target_select" name="target_select">
              <option value="">— Loading programmes and events… —</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="full_name" data-i18n="contact.name_label">Full Name <span class="req">*</span></label>
              <input class="form-input" id="full_name" name="full_name" type="text" placeholder="Your full name" data-i18n-placeholder="contact.name_placeholder" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="email" data-i18n="contact.email_label">Email Address <span class="req">*</span></label>
              <input class="form-input" id="email" name="email" type="email" placeholder="you@example.com" data-i18n-placeholder="contact.email_placeholder" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="phone" data-i18n="register.phone_label">Phone Number</label>
              <input class="form-input" id="phone" name="phone" type="tel" inputmode="tel" placeholder="+92 300 0000000" oninput="this.value=this.value.replace(/[^0-9+\s\-()]/g,'')" />
            </div>
            <div class="form-group">
              <label class="form-label" for="age" data-i18n="register.age_label">Age</label>
              <input class="form-input" id="age" name="age" type="number" min="8" max="99" inputmode="numeric" placeholder="Your age" oninput="this.value=this.value.replace(/[^0-9]/g,'')" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="institution" data-i18n="register.institution_label">School / University / Institution</label>
            <input class="form-input" id="institution" name="institution" type="text" placeholder="Where do you study?" />
          </div>
          <div class="form-group">
            <label class="form-label" for="experience_level" data-i18n="register.exp_label">Debate Experience Level</label>
            <select class="form-select" id="experience_level" name="experience_level">
              <option value="">— Select —</option>
              <option value="beginner" data-i18n="register.exp_beginner">Beginner (little or no experience)</option>
              <option value="intermediate" data-i18n="register.exp_intermediate">Intermediate (some competitions)</option>
              <option value="advanced" data-i18n="register.exp_advanced">Advanced (regular competitor)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="notes" data-i18n="register.notes_label">Additional Notes or Questions</label>
            <textarea class="form-textarea" id="notes" name="notes" placeholder="Anything we should know about your registration?" data-i18n-placeholder="register.notes_placeholder"></textarea>
          </div>

          <div style="margin-top: var(--sp-8); display: flex; gap: var(--sp-4); align-items: center; flex-wrap: wrap;">
            <button type="submit" class="btn btn--primary btn--lg" id="submit-btn" data-i18n="btn.submit">
              Submit Registration →
            </button>
            <span id="submit-status" style="font-size: var(--text-body-sm); color: var(--color-text-muted);"></span>
          </div>
        </form>

      </div>
    </section>

  </main>

  <footer id="app-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/main.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    let type = params.get('type') || 'program';
    let refId = params.get('id');
    const name = params.get('name');

    function updateRegHeader() {
      const isZh = window.I18N && window.I18N.lang === 'zh';
      if (refId) {
        document.getElementById('reg-type-label').textContent = type === 'event' 
          ? (isZh ? '赛事报名' : 'Event Registration') 
          : (isZh ? '课程申请' : 'Programme Application');
        document.getElementById('reg-title').textContent = name || (type === 'event' 
          ? (isZh ? '赛事在线报名' : 'Event Sign-up') 
          : (isZh ? '课程在线申请' : 'Programme Application'));
        document.getElementById('reg-subtitle').textContent =
          type === 'event'
            ? (isZh ? '请填写表格以完成赛事报名。我们将在确认后向您发送确认信函。' : 'Complete the form to register for this event. You will receive a confirmation email.')
            : (isZh ? '请填写表格以申请此课程。我们的学术团队将在2个工作日内与您联系。' : 'Complete the form to apply for this programme. Our team will follow up within 2 business days.');
      } else {
        document.getElementById('reg-type-label').setAttribute('data-i18n', 'register.hero_eyebrow');
        document.getElementById('reg-title').setAttribute('data-i18n', 'register.hero_title');
        document.getElementById('reg-subtitle').setAttribute('data-i18n', 'register.hero_subtitle');
        if (window.I18N) window.I18N.translateDOM(document.querySelector('.page-hero'));
      }
    }

    updateRegHeader();
    window.onLangChange = function() {
      updateRegHeader();
    };

    if (!refId) {
      const targetGroup = document.getElementById('target-group');
      const targetSelect = document.getElementById('target_select');
      targetGroup.style.display = 'block';

      (async function loadTargets() {
        try {
          const [progRes, evRes] = await Promise.all([
            API.programs.list().catch(() => ({ programs: [] })),
            API.events.list('open,upcoming').catch(() => ({ events: [] }))
          ]);

          const isZh = window.I18N && window.I18N.lang === 'zh';
          let html = `<option value="">— ${isZh ? '请选择课程项目或赛事' : 'Select a Programme or Event'} —</option>`;
          if (progRes.programs && progRes.programs.length > 0) {
            html += `<optgroup label="${isZh ? '学院课程项目' : 'Academic Programmes'}">`;
            progRes.programs.forEach(p => {
              const pTitle = window.I18N ? window.I18N.db(p.slug, 'title', p.title) : p.title;
              html += `<option value="program:${p.id}">${isZh ? '课程' : 'Programme'}: ${pTitle}</option>`;
            });
            html += '</optgroup>';
          }
          if (evRes.events && evRes.events.length > 0) {
            html += `<optgroup label="${isZh ? '近期赛事与锦标赛' : 'Upcoming Events & Tournaments'}">`;
            evRes.events.forEach(e => {
              const eTitle = window.I18N ? window.I18N.db(e.slug, 'title', e.title) : e.title;
              html += `<option value="event:${e.id}">${isZh ? '赛事' : 'Event'}: ${eTitle}</option>`;
            });
            html += '</optgroup>';
          }
          targetSelect.innerHTML = html;
        } catch (err) {
          targetSelect.innerHTML = '<option value="">Failed to load options. Please refresh.</option>';
        }
      })();
    }

    document.getElementById('reg-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const status = document.getElementById('submit-status');

      const fullName = document.getElementById('full_name').value.trim();
      const email    = document.getElementById('email').value.trim();
      if (!fullName || !email) {
        document.getElementById('alert-area').innerHTML = '<div class="alert alert--error">Please fill in all required fields.</div>';
        if (window.showToast) window.showToast('Please fill in required fields.', 'error');
        return;
      }

      let submitType = type;
      let submitRefId = refId ? parseInt(refId) : null;

      if (!refId) {
        const selectedVal = document.getElementById('target_select').value;
        if (!selectedVal) {
          document.getElementById('alert-area').innerHTML = '<div class="alert alert--error">Please select a programme or event to apply for.</div>';
          if (window.showToast) window.showToast('Please select a programme or event.', 'error');
          return;
        }
        const parts = selectedVal.split(':');
        submitType = parts[0];
        submitRefId = parseInt(parts[1]);
      }

      btn.disabled = true;
      btn.textContent = 'Submitting…';
      status.textContent = '';
      document.getElementById('alert-area').innerHTML = '';

      const payload = {
        type:              submitType,
        reference_id:      submitRefId,
        full_name:         fullName,
        email:             email,
        phone:             document.getElementById('phone').value.trim() || null,
        age:               parseInt(document.getElementById('age').value) || null,
        institution:       document.getElementById('institution').value.trim() || null,
        experience_level:  document.getElementById('experience_level').value || null,
        notes:             document.getElementById('notes').value.trim() || null,
      };

      try {
        const res = await API.registrations.create(payload);
        document.getElementById('reg-form').style.display = 'none';
        document.getElementById('success-view').style.display = 'block';
        document.getElementById('success-msg').textContent =
          `Your registration has been received (ID: ${res.id}). We will contact you at ${email} shortly.`;
        if (window.showToast) window.showToast('Registration submitted successfully!', 'success');
      } catch(err) {
        document.getElementById('alert-area').innerHTML = `<div class="alert alert--error">${err.message}</div>`;
        if (window.showToast) window.showToast(err.message || 'Submission failed.', 'error');
        btn.disabled = false;
        btn.textContent = 'Submit Registration →';
      }
    });
  </script>
</body>
</html>
