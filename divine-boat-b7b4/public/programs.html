  <script>
    (function(){
      var t = localStorage.getItem('pdf_theme') || 'dark';
      var l = localStorage.getItem('pdf_lang');
      if (!l) {
        try {
          var langs = navigator.languages || [navigator.language || ''];
          var hasZh = langs.some(function(lang){ return String(lang || '').toLowerCase().startsWith('zh'); });
          var tz = typeof Intl !== 'undefined' && Intl.DateTimeFormat ? Intl.DateTimeFormat().resolvedOptions().timeZone || '' : '';
          var chinaTz = ['Asia/Shanghai', 'Asia/Chongqing', 'Asia/Urumqi', 'Asia/Harbin', 'Asia/Hong_Kong', 'Asia/Macau', 'Asia/Taipei'];
          if (hasZh || chinaTz.indexOf(tz) !== -1) { l = 'zh'; }
        } catch(e){}
      }
      l = l === 'zh' ? 'zh' : 'en';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('lang', l === 'zh' ? 'zh-CN' : 'en');
    })();
  </script>

<body>

  <main id="main-content">

    <!-- ─── PAGE HERO ─────────────────────────────────────── -->

      <div class="container">
        <div class="section-header" data-reveal>
          <p class="eyebrow" data-i18n="programs.hero_eyebrow">PDF Academy</p>
          <h1 class="section-title" style="font-size: var(--text-display-lg);" data-i18n="programs.hero_title">All Programs</h1>
          <p class="section-subtitle" data-i18n="programs.hero_subtitle">
            Structured training from beginner to international readiness — in-person, online, and hybrid. Open to students and debaters worldwide.
          </p>
        </div>
      </div>
    </section>

    <!-- ─── DISCOVERY ─────────────────────────────────────── -->
    <section class="section">
      <div class="container">

        <div class="filter-bar" id="filter-bar" data-reveal>
          <button class="filter-btn is-active" data-cat="all" data-i18n="btn.filter_all">All</button>
          <button class="filter-btn" data-cat="debate" data-i18n="category.debate">Debate</button>
          <button class="filter-btn" data-cat="public_speaking" data-i18n="category.public_speaking">Public Speaking</button>
          <button class="filter-btn" data-cat="writing" data-i18n="category.writing">Writing</button>

        </div>

        <div id="programs-grid" class="grid-3">
          <div class="state-loading"><div class="spinner"></div></div>
        </div>
      </div>
    </section>

    <!-- ─── CTA ───────────────────────────────────────────── -->
    <section class="cta-block academy-cta-bg">
      <div class="container" data-reveal>
        <h2 class="cta-block__title" data-i18n="programs.cta_title">Don't See What You Need?</h2>
        <p class="cta-block__text" data-i18n="programs.cta_text">Reach out and we'll help you find the right path.</p>
        <div class="cta-block__actions">
          <a href="/contact.html" class="btn btn--primary btn--lg" data-i18n="btn.contact_us">Contact Us</a>

        </div>

  <footer id="app-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/main.js"></script>
  <script>
    let allPrograms = [];
    let activeFilter = 'all';

    function levelBadge(level) {
      const map = { beginner: 'badge--green', intermediate: 'badge--accent', advanced: 'badge--blue', all: 'badge--muted' };
      const translatedLevel = window.I18N ? window.I18N.t(`level.${level}`) : level;
      return `<span class="badge ${map[level] || 'badge--muted'}" data-i18n="level.${level}">${translatedLevel}</span>`;
    }

    function renderGrid(programs) {
      const el = document.getElementById('programs-grid');
      if (!programs.length) { 
        el.innerHTML = '<div class="state-empty" data-i18n="programs.empty">No programs found in this category.</div>'; 
        if (window.I18N) window.I18N.translateDOM(el);
        return; 
      }
      el.innerHTML = programs.map(p => {
        const title = window.I18N ? window.I18N.db(p.slug, 'title', p.title) : p.title;
        const rawDesc = window.I18N ? window.I18N.db(p.slug, 'desc', p.description) : p.description;
        const desc = rawDesc ? (rawDesc.length > 150 ? rawDesc.substring(0, 150) + '…' : rawDesc) : '';
        const translatedCat = window.I18N ? window.I18N.t(`category.${p.category}`) : p.category.replace('_', ' ');
        const translatedMode = window.I18N ? window.I18N.t(`mode.${p.delivery_mode}`) : p.delivery_mode.replace('_', ' ');
        const isZh = window.I18N && window.I18N.lang === 'zh';
        const ageText = (p.age_min || p.age_max) ? `${p.age_min || ''}${p.age_max ? '–' + p.age_max + (isZh ? ' 岁' : ' yrs') : ''}` : '';
        const coachText = p.coach_name ? ` · ${isZh ? '导师' : 'Coach'}: ${p.coach_name}` : '';
        const priceText = p.price ? 'PKR ' + p.price.toLocaleString() : (isZh ? '咨询学费' : 'Contact for pricing');

        return `
        <article class="card card--interactive" data-reveal>
          <div class="card__body">
            <p class="card__eyebrow" data-i18n="category.${p.category}">${translatedCat}</p>
            <h2 class="card__title">${title}</h2>
            <p class="card__description">${desc}</p>
            <div style="display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-4);">
              ${levelBadge(p.level)}
              <span class="badge badge--muted" data-i18n="mode.${p.delivery_mode}">${translatedMode}</span>
              ${p.duration ? `<span class="badge badge--muted">${p.duration}</span>` : ''}
            </div>
          </div>
          <div class="card__footer">
            <div>
              <div style="font-size: var(--text-meta); color: var(--color-text-tertiary);">
                ${ageText}${coachText}
              </div>
              <div style="font-size: var(--text-body-sm); color: var(--color-accent-gold); margin-top: 2px;">
                ${priceText}
              </div>
            </div>
            <a href="/program.html?id=${p.id}" class="btn btn--primary btn--sm" data-i18n="btn.view_details">View →</a>
          </div>
        </article>`;
      }).join('');
      if (window.initReveals) window.initReveals(el);
      if (window.I18N) window.I18N.translateDOM(el);
    }

    function applyFilter(cat, pushHistory = true) {
      activeFilter = cat || 'all';
      const btn = document.querySelector(`.filter-btn[data-cat="${activeFilter}"]`) || document.querySelector(`.filter-btn[data-cat="all"]`);
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('is-active'));
      if (btn) {
        btn.classList.add('is-active');
        activeFilter = btn.dataset.cat;
      }

      if (pushHistory) {
        const url = new URL(window.location.href);
        if (activeFilter !== 'all') {
          url.searchParams.set('category', activeFilter);
        } else {
          url.searchParams.delete('category');
        }
        window.history.pushState({}, '', url.toString());
      }

      const filtered = activeFilter === 'all' ? allPrograms : allPrograms.filter(p => p.category === activeFilter);
      renderGrid(filtered);
    }

    window.onLangChange = function() {
      applyFilter(activeFilter, false);
    };

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const urlCat = params.get('category');
      if (urlCat) activeFilter = urlCat;

      try {
        const { programs } = await API.programs.list();
        allPrograms = programs;
        applyFilter(activeFilter, false);
      } catch(e) {
        document.getElementById('programs-grid').innerHTML = `<div class="state-error">${e.message}</div>`;
      }
    }

    document.getElementById('filter-bar').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      applyFilter(btn.dataset.cat, true);
    });

    window.addEventListener('popstate', () => {
      const params = new URLSearchParams(window.location.search);
      const urlCat = params.get('category') || 'all';
      applyFilter(urlCat, false);
    });

    init();
  </script>
</body>
