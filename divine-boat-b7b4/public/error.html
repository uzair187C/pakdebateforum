<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Error | Pak Debate Forum</title>
  <script>
    (function(){
      var t = localStorage.getItem('pdf_theme') || 'dark';
      var l = localStorage.getItem('pdf_lang') || 'en';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('lang', l === 'zh' ? 'zh-CN' : 'en');
    })();
  </script>
  <meta name="description" content="An unexpected application error occurred. Pak Debate Forum system administrators have been notified.">
  <link rel="canonical" href="https://pakdebateforum.org/error.html">

  <!-- Open Graph / Social Media -->
  <meta property="og:title" content="System Error — Pak Debate Forum">
  <meta property="og:description" content="An unexpected application exception occurred.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://pakdebateforum.org/assets/brand/pdf-logo.png">
  <meta name="twitter:card" content="summary">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/page.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body>
  <!-- Header Nav -->
  <header id="app-nav"></header>
  <div id="app-drawer"></div>

  <main id="main-content" class="page-error">
    <section class="section section--hero bg-surface-base flex-center min-vh-80">
      <div class="container container--narrow text-center">
        <div data-reveal="fade-up">
          <p class="hero__eyebrow text-gold">500 Exception</p>
          <h1 class="hero__title margin-bottom-4">Temporary <span class="text-gold">Service Disruption</span></h1>
          <p class="hero__lead margin-bottom-8">
            We are experiencing a momentary system exception. Our operational team has been notified and is working to restore services.
          </p>

          <div class="hero__actions flex-center gap-4">
            <button onclick="location.reload()" class="btn btn--primary btn--lg">Try Again</button>
            <a href="/" class="btn btn--secondary btn--lg">Return Home</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer id="app-footer"></footer>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/nav.js"></script>
</body>
</html>
